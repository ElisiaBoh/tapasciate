name: Scraper
on:
  schedule:
    - cron: '0 4 * * 3'  # every Wednesday at 6 CEST (4:00 UTC)
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    env:
      # A livello di job perché i secret non sono leggibili direttamente negli `if` degli step
      NETLIFY_BUILD_HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          cd scraper
          pip install -r requirements.txt
      
      - name: Run scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          cd scraper
          python main.py

      # Ricostruisce il sito su Netlify così la sitemap include gli eventi appena aggiornati.
      # Richiede il secret NETLIFY_BUILD_HOOK (Netlify → Site configuration → Build hooks); se manca lo step è saltato.
      - name: Trigger Netlify build
        if: ${{ env.NETLIFY_BUILD_HOOK != '' }}
        run: curl -fsS -X POST -d '{}' "$NETLIFY_BUILD_HOOK"
